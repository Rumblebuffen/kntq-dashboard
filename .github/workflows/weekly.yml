name: Weekly commitments check

on:
  schedule:
    - cron: '23 2 * * 1' # Mondays 09:23 ICT
  workflow_dispatch:

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diff Kinetiq's buyback feed and the Elysium sitemap against last week
        run: npm run weekly -- --data-dir data
        env:
          ALERTS_OUT: ${{ runner.temp }}/alerts.json
      - name: Commit data
        if: always()
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -q -m "Weekly commitments check $(date -u +%Y-%m-%d)"
          git push
      - name: Open an issue if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS_OUT: ${{ runner.temp }}/alerts.json
        run: |
          [ -s "$ALERTS_OUT" ] || exit 0
          jq -c '.[]' "$ALERTS_OUT" | while read -r a; do
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$(jq -r .title <<<"$a")" --body "$(jq -r .body <<<"$a")"
          done
