name: Daily rebuild

on:
  schedule:
    - cron: '43 18 * * *' # 01:43 ICT
  workflow_dispatch:

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Re-check the AF ledger, snapshot kPoints holders, rebuild aggregates
        run: npm run daily -- --data-dir data
      - name: Commit data
        if: always()
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -q -m "Daily rebuild $(date -u +%Y-%m-%d)"
          git push
      # GitHub disables scheduled workflows after 60 days without repository activity. The data branch gets
      # hourly commits, but in case only the default branch counts, an empty commit after 45 quiet days keeps
      # the schedule alive. GITHUB_TOKEN pushes do not retrigger workflows.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'Keep scheduled collection alive'
            git push
          fi
